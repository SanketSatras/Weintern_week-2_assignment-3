<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Secure User Registration - Full-Stack Authentication System">
  <title>Create an Account | Authentication System</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page-container">
    <div class="auth-card" role="region" aria-labelledby="register-heading">
      <header class="card-header">
        <div class="brand-badge">
          <span>&#128274; Auth Core</span>
        </div>
        <h1 id="register-heading" class="card-title">Create Account</h1>
        <p class="card-subtitle">Sign up for secure, authenticated dashboard access</p>
      </header>

      <!-- Global Alert / Status Notification -->
      <div id="alertBanner" class="alert-banner" role="alert" aria-live="polite"></div>

      <!-- Registration Form -->
      <form id="registerForm" novalidate>
        <!-- Username Field -->
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="username"
              name="username"
              class="form-input"
              placeholder="e.g. alex_rivera"
              autocomplete="username"
              required
              aria-describedby="usernameError"
            >
          </div>
          <div id="usernameError" class="field-error" aria-live="polite"></div>
          <p class="field-hint">3–30 characters, letters, numbers, and underscores.</p>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="alex@example.com"
              autocomplete="email"
              required
              aria-describedby="emailError"
            >
          </div>
          <div id="emailError" class="field-error" aria-live="polite"></div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Minimum 8 characters"
              autocomplete="new-password"
              required
              aria-describedby="passwordError passwordStrength"
            >
            <button
              type="button"
              id="togglePasswordBtn"
              class="password-toggle-btn"
              aria-label="Toggle password visibility"
            >
              Show
            </button>
          </div>
          <div id="passwordError" class="field-error" aria-live="polite"></div>

          <!-- Password Strength Indicator -->
          <div id="passwordStrength" class="strength-meter-container">
            <div class="strength-bar-track">
              <div id="strengthBarFill" class="strength-bar-fill"></div>
            </div>
            <span id="strengthText" class="strength-label">Password Strength: -</span>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              class="form-input"
              placeholder="Re-enter password"
              autocomplete="new-password"
              required
              aria-describedby="confirmPasswordError"
            >
            <button
              type="button"
              id="toggleConfirmPasswordBtn"
              class="password-toggle-btn"
              aria-label="Toggle confirm password visibility"
            >
              Show
            </button>
          </div>
          <div id="confirmPasswordError" class="field-error" aria-live="polite"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-primary">
          <span class="spinner" aria-hidden="true"></span>
          <span id="submitBtnText">Create Account</span>
        </button>
      </form>

      <!-- Card Footer Navigation -->
      <footer class="card-footer">
        <p>Already have an account? <a href="login.html" id="linkToLogin">Sign in here</a></p>
      </footer>
    </div>
  </main>

  <script src="js/register.js"></script>
</body>
</html>
